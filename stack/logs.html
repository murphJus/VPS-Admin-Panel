var activeFilter = 'all';

function colorClass(t){
  return {warn:'mc-log-warn',error:'mc-log-error',success:'mc-log-success',dim:'mc-log-dim'}[t]||'mc-log-dim';
}

function renderLogs(query){
  var container = document.getElementById('logs-main');
  var logs = LOGS.filter(function(l){
    return activeFilter === 'all' || l.c === activeFilter;
  });
  container.innerHTML = '';
  logs.forEach(function(l){
    var line = document.createElement('div');
    var text = l.m;
    if(query && text.toLowerCase().includes(query.toLowerCase())){
      var idx = text.toLowerCase().indexOf(query.toLowerCase());
      line.className = colorClass(l.t);
      line.innerHTML = text.slice(0,idx)+'<span class="mc-highlight">'+text.slice(idx,idx+query.length)+'</span>'+text.slice(idx+query.length);
    } else {
      if(query) line.style.opacity = '0.2';
      line.className = colorClass(l.t);
      line.textContent = text;
    }
    container.appendChild(line);
  });
  container.scrollTop = container.scrollHeight;
}

function setFilter(filter, btn){
  activeFilter = filter;
  document.querySelectorAll('.mc-filter-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  renderLogs(document.getElementById('search-main').value.trim());
}

function doSearch(){ renderLogs(document.getElementById('search-main').value.trim()); }
function clearSearch(){ document.getElementById('search-main').value=''; renderLogs(''); }

    <script>
    (function(){
    var canvas=document.getElementById("bg-canvas"),ctx=canvas.getContext("2d"),W,H;
    function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
    resize();window.addEventListener("resize",resize);
    var particles=[];for(var i=0;i<60;i++)particles.push({x:Math.random(),y:Math.random(),vy:0.0002+Math.random()*0.0004,size:0.5+Math.random()*1.5,alpha:0.2+Math.random()*0.5});
    var scanLines=[];for(var i=0;i<4;i++)scanLines.push({y:Math.random(),vy:0.0003+Math.random()*0.0004,alpha:0.03+Math.random()*0.04});
    var chars="01アイウエオカキクケコサシスセソ",dataStreams=[];
    for(var i=0;i<18;i++)dataStreams.push({x:Math.random(),y:Math.random()*-1,vy:0.001+Math.random()*0.002,chars:Array.from({length:8+Math.floor(Math.random()*8)},function(){return chars[Math.floor(Math.random()*chars.length)];}),alpha:0.06+Math.random()*0.1,tickRate:20+Math.floor(Math.random()*30),tick:0});
    var pulseRings=[];for(var i=0;i<3;i++)pulseRings.push({x:0.2+Math.random()*0.6,y:0.2+Math.random()*0.6,r:Math.random(),vr:0.0008+Math.random()*0.001,alpha:0.08+Math.random()*0.08});
    function drawGrid(){var cols=24,rows=14,cw=W/cols,ch=H/rows;ctx.strokeStyle="rgba(30,50,80,0.35)";ctx.lineWidth=0.5;for(var x=0;x<=cols;x++){ctx.beginPath();ctx.moveTo(x*cw,0);ctx.lineTo(x*cw,H);ctx.stroke();}for(var y=0;y<=rows;y++){ctx.beginPath();ctx.moveTo(0,y*ch);ctx.lineTo(W,y*ch);ctx.stroke();}}
    function drawPerspectiveGrid(){var vx=W*0.5,vy=H*0.55,lines=16,hlines=10;ctx.strokeStyle="rgba(40,70,120,0.18)";ctx.lineWidth=0.5;for(var i=0;i<=lines;i++){var x=(i/lines)*W;ctx.beginPath();ctx.moveTo(x,H);ctx.lineTo(vx,vy);ctx.stroke();}for(var j=0;j<=hlines;j++){var p=j/hlines,ease=Math.pow(p,2.5),y=vy+(H-vy)*ease,lx=vx*(1-ease),rx=vx+(W-vx)*ease;ctx.beginPath();ctx.moveTo(lx,y);ctx.lineTo(rx,y);ctx.stroke();}}
    function drawHorizonGlow(){var vy=H*0.55,grad=ctx.createLinearGradient(0,vy-40,0,vy+40);grad.addColorStop(0,"rgba(80,120,255,0)");grad.addColorStop(0.5,"rgba(80,120,255,0.07)");grad.addColorStop(1,"rgba(80,120,255,0)");ctx.fillStyle=grad;ctx.fillRect(0,vy-40,W,80);}
    function drawScanLines(){scanLines.forEach(function(s){s.y+=s.vy;if(s.y>1)s.y=0;var y=s.y*H,grad=ctx.createLinearGradient(0,y-60,0,y+60);grad.addColorStop(0,"rgba(100,160,255,0)");grad.addColorStop(0.5,"rgba(100,160,255,"+s.alpha+")");grad.addColorStop(1,"rgba(100,160,255,0)");ctx.fillStyle=grad;ctx.fillRect(0,y-60,W,120);});}
    function drawParticles(){particles.forEach(function(p){p.y-=p.vy;if(p.y<0){p.y=1;p.x=Math.random();}ctx.beginPath();ctx.arc(p.x*W,p.y*H,p.size,0,Math.PI*2);ctx.fillStyle="rgba(120,160,220,"+p.alpha+")";ctx.fill();});}
    function drawDataStreams(){ctx.font="10px monospace";dataStreams.forEach(function(s){s.y+=s.vy;s.tick++;if(s.tick>s.tickRate){s.tick=0;s.chars.push(chars[Math.floor(Math.random()*chars.length)]);s.chars.shift();}if(s.y>1.5){s.y=-0.3;s.x=Math.random();}s.chars.forEach(function(c,i){ctx.fillStyle="rgba(100,160,220,"+(i/s.chars.length*s.alpha)+")";ctx.fillText(c,s.x*W,s.y*H+i*12);});});}
    function drawPulseRings(){pulseRings.forEach(function(ring){ring.r+=ring.vr;if(ring.r>1)ring.r=0;ctx.beginPath();ctx.arc(ring.x*W,ring.y*H,ring.r*Math.min(W,H)*0.6,0,Math.PI*2);ctx.strokeStyle="rgba(80,120,200,"+(ring.alpha*(1-ring.r))+")";ctx.lineWidth=1;ctx.stroke();});}
    function drawCornerAccents(){var size=24;ctx.strokeStyle="rgba(80,130,200,0.4)";ctx.lineWidth=1.5;[[0,0,1,1],[W,0,-1,1],[0,H,1,-1],[W,H,-1,-1]].forEach(function(c){ctx.beginPath();ctx.moveTo(c[0]+c[2]*size,c[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(c[0],c[1]+c[3]*size);ctx.stroke();});}
    (function frame(){ctx.clearRect(0,0,W,H);ctx.fillStyle="#080a0f";ctx.fillRect(0,0,W,H);drawGrid();drawPerspectiveGrid();drawHorizonGlow();drawScanLines();drawDataStreams();drawParticles();drawPulseRings();drawCornerAccents();requestAnimationFrame(frame);})();
    })();
    </script>
