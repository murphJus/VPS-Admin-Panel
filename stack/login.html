<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var flat=document.getElementById('flat-canvas'),fctx=flat.getContext('2d'),W,H;
function resize(){W=flat.width=window.innerWidth;H=flat.height=window.innerHeight;}
resize();

var particles=[];
for(var i=0;i<50;i++) particles.push({x:Math.random(),y:Math.random(),vy:0.0002+Math.random()*0.0003,size:0.5+Math.random()*1.2,alpha:0.15+Math.random()*0.3});
var scanLines=[];
for(var i=0;i<3;i++) scanLines.push({y:Math.random(),vy:0.0003+Math.random()*0.0003,alpha:0.025+Math.random()*0.03});
var chars='01アイウカキクサシス';
var streams=[];
for(var i=0;i<12;i++) streams.push({x:Math.random(),y:Math.random()*-1,vy:0.0008+Math.random()*0.0015,chars:Array.from({length:6+Math.floor(Math.random()*6)},function(){return chars[Math.floor(Math.random()*chars.length)];}),alpha:0.04+Math.random()*0.07,tick:0,tickRate:25+Math.floor(Math.random()*25)});

function drawFlat(){
  fctx.clearRect(0,0,W,H);fctx.fillStyle='#080a0f';fctx.fillRect(0,0,W,H);
  var cols=24,rows=14,cw=W/cols,ch=H/rows;
  fctx.strokeStyle='rgba(25,40,65,0.3)';fctx.lineWidth=0.5;
  for(var x=0;x<=cols;x++){fctx.beginPath();fctx.moveTo(x*cw,0);fctx.lineTo(x*cw,H);fctx.stroke();}
  for(var y=0;y<=rows;y++){fctx.beginPath();fctx.moveTo(0,y*ch);fctx.lineTo(W,y*ch);fctx.stroke();}
  scanLines.forEach(function(s){s.y+=s.vy;if(s.y>1)s.y=0;var y=s.y*H,g=fctx.createLinearGradient(0,y-50,0,y+50);g.addColorStop(0,'rgba(80,130,255,0)');g.addColorStop(0.5,'rgba(80,130,255,'+s.alpha+')');g.addColorStop(1,'rgba(80,130,255,0)');fctx.fillStyle=g;fctx.fillRect(0,y-50,W,100);});
  fctx.font='10px monospace';
  streams.forEach(function(s){s.y+=s.vy;s.tick++;if(s.tick>s.tickRate){s.tick=0;s.chars.push(chars[Math.floor(Math.random()*chars.length)]);s.chars.shift();}if(s.y>1.4){s.y=-0.2;s.x=Math.random();}s.chars.forEach(function(c,i){fctx.fillStyle='rgba(80,130,200,'+(i/s.chars.length*s.alpha)+')';fctx.fillText(c,s.x*W,s.y*H+i*12);});});
  particles.forEach(function(p){p.y-=p.vy;if(p.y<0){p.y=1;p.x=Math.random();}fctx.beginPath();fctx.arc(p.x*W,p.y*H,p.size,0,Math.PI*2);fctx.fillStyle='rgba(100,140,200,'+p.alpha+')';fctx.fill();});
  var size=20;fctx.strokeStyle='rgba(60,100,160,0.35)';fctx.lineWidth=1.2;
  [[0,0,1,1],[W,0,-1,1],[0,H,1,-1],[W,H,-1,-1]].forEach(function(c){fctx.beginPath();fctx.moveTo(c[0]+c[2]*size,c[1]);fctx.lineTo(c[0],c[1]);fctx.lineTo(c[0],c[1]+c[3]*size);fctx.stroke();});
}

var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(45,1,0.1,1000);
camera.position.z=2.8;
var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('globe-canvas'),alpha:true,antialias:true});
renderer.setPixelRatio(window.devicePixelRatio);

function resizeThree(){var c=document.getElementById('globe-canvas'),w=c.offsetWidth,h=c.offsetHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
resizeThree();

var globeGroup=new THREE.Group();scene.add(globeGroup);

globeGroup.add(new THREE.Mesh(
  new THREE.SphereGeometry(1,48,48),
  new THREE.MeshPhongMaterial({color:0x0a1628,emissive:0x060e1a,transparent:true,opacity:0})
));

globeGroup.add(new THREE.Mesh(
  new THREE.SphereGeometry(1.002,28,28),
  new THREE.MeshBasicMaterial({color:0x2a5aaa,wireframe:true,transparent:true,opacity:0.28})
));

[0.7,0.35,0,-0.35,-0.7].forEach(function(lat){
  var r=Math.cos(Math.asin(lat)),pts=[];
  for(var i=0;i<=64;i++) pts.push(new THREE.Vector3(r*Math.cos(i/64*Math.PI*2),lat,r*Math.sin(i/64*Math.PI*2)));
  globeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x1e4a8a,transparent:true,opacity:0.25})));
});

for(var l=0;l<8;l++){
  var angle=(l/8)*Math.PI,pts2=[];
  for(var i=0;i<=64;i++){var phi=(i/64)*Math.PI*2;pts2.push(new THREE.Vector3(Math.sin(phi)*Math.cos(angle),Math.cos(phi),Math.sin(phi)*Math.sin(angle)));}
  globeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts2),new THREE.LineBasicMaterial({color:0x1e4a8a,transparent:true,opacity:0.2})));
}

scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(1.12,32,32),
  new THREE.MeshPhongMaterial({color:0x0a2050,transparent:true,opacity:0.06,side:THREE.FrontSide})
));

function latLonToVec(lat,lon,r){
  var phi=(90-lat)*Math.PI/180,theta=(lon+180)*Math.PI/180;
  return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta));
}

var nodePoints=[
  {lat:40.7,lon:-74.0},
  {lat:51.5,lon:-0.1},
  {lat:35.6,lon:139.7},
  {lat:-33.8,lon:151.2},
  {lat:48.8,lon:2.3},
  {lat:1.3,lon:103.8}
];

nodePoints.forEach(function(n){
  var v=latLonToVec(n.lat,n.lon,1.02);
  var dot=new THREE.Mesh(new THREE.SphereGeometry(0.022,8,8),new THREE.MeshBasicMaterial({color:0x4488ff,transparent:true,opacity:0.9}));
  dot.position.copy(v);globeGroup.add(dot);
  var ring=new THREE.Mesh(new THREE.SphereGeometry(0.045,8,8),new THREE.MeshBasicMaterial({color:0x2255cc,transparent:true,opacity:0.2,wireframe:true}));
  ring.position.copy(v);globeGroup.add(ring);
});

for(var i=0;i<nodePoints.length-1;i++){
  var a=latLonToVec(nodePoints[i].lat,nodePoints[i].lon,1.02);
  var b=latLonToVec(nodePoints[(i+1)%nodePoints.length].lat,nodePoints[(i+1)%nodePoints.length].lon,1.02);
  var mid=a.clone().add(b).normalize().multiplyScalar(1.3);
  var curve=new THREE.QuadraticBezierCurve3(a,mid,b);
  globeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(32)),new THREE.LineBasicMaterial({color:0x2255aa,transparent:true,opacity:0.35})));
}

scene.add(new THREE.AmbientLight(0x0a1830,2));
var dl=new THREE.DirectionalLight(0x2244aa,1.5);dl.position.set(5,3,5);scene.add(dl);
var rl=new THREE.DirectionalLight(0x112244,0.8);rl.position.set(-5,-2,-3);scene.add(rl);
globeGroup.rotation.x=0.2;

window.addEventListener('resize',function(){resize();resizeThree();});

(function loop(){
  drawFlat();
  globeGroup.rotation.y+=0.002;
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
})();
</script>
